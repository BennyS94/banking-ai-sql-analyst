[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-ai-sql-analyst"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18,<2",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.3,<4",
    "SQLAlchemy>=2.0,<3",
]

[tool.setuptools]
packages = ["banking_data"]
